[package]
name = "raea-io-av1"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "raea's royalty-free AV1 media backend: rav1d decode, rav1e encode, Opus audio, muxide"

[dependencies]
raea-io-codec = { path = "../codec", features = ["mux"] }
raea-io-soft = { path = "../soft" }
muxide = "0.2"
rav1e = { version = "0.8", default-features = false, features = ["threading"] }

# from the v1.1.0 tag: the crates.io package leaves out src/arm/asm-offsets.h, which its arm assembly includes
[target.'cfg(not(all(windows, target_arch = "aarch64")))'.dependencies]
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0" }

# Windows on ARM (fork): rav1d's arm64 assembly is GNU-syntax .S, which MSVC's armasm64 can't build (lib.exe then finds
# no objects, LNK1181), so there it decodes in Rust alone, without the assembly. Resolver 2 keeps the other targets'
# features apart, so every other platform keeps its assembly
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
